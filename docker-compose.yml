version: '3.8'

services:
  # ========================================================
  # 1. PostgreSQL Database Service
  # Optimized for 1 vCPU / 2GB RAM host machine
  # ========================================================
  db:
    image: postgres:16-alpine
    container_name: hardman_reed_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hardman_secure_db_pass}
      POSTGRES_DB: ${POSTGRES_DB:-hardman_reed}
    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=40
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c effective_cache_size=384MB
      -c log_min_messages=warning
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hardman_reed"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hardman_internal

  # ========================================================
  # 2. Hardman & Reed Security API Backend
  # WAF, Request Logger & Database Ingestion
  # ========================================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hardman_reed_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-hardman_secure_db_pass}@db:5432/${POSTGRES_DB:-hardman_reed}
      CORS_ORIGIN: http://localhost,http://localhost:80,http://frontend,https://hardmanreed.com
    ports:
      - "5000:5000"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/security/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - hardman_internal

  # ========================================================
  # 3. Frontend Web Service
  # Production Nginx reverse-proxy & React Single Page App
  # ========================================================
  frontend:
    build:
      context: ./Landing_Website
      dockerfile: Dockerfile
    container_name: hardman_reed_frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - hardman_internal

volumes:
  postgres_data:
    driver: local

networks:
  hardman_internal:
    driver: bridge

